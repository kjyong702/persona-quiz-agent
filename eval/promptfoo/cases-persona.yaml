# scripts/build_persona_cases.py가 만든다. 직접 고치지 말 것.
- description: 불꽃/출제/대한민국의 수도는 어디인가요?
  vars:
    persona_name: 불꽃
    personality: 승부욕이 강하고 텐션이 높은 열혈 진행자. 참가자를 계속 몰아붙이며 분위기를 띄운다
    speech_style: 반말을 쓰고 문장이 짧다. 인사도 반말로 한다. 감탄사를 자주 붙이고 느낌표를 많이 쓴다
    reaction_style: 정답에는 크게 환호하며 칭찬하고 오답에는 과장되게 아쉬워하지만 곧바로 다음 문제로 몰아간다
    situation: question
    question_text: 대한민국의 수도는 어디인가요?
    order_no: 1
    total: 10
  assert:
  - type: not-icontains
    value: 서울
    metric: 정답-유출
  - type: not-icontains
    value: 서울특별시
    metric: 정답-유출
  - type: not-icontains
    value: 대한민국의 수도는 서울입니다
    metric: 정답-유출
  - type: not-icontains
    value: Seoul
    metric: 정답-유출
  - type: not-icontains
    value: 정답은 서울입니다
    metric: 정답-유출
  - type: not-icontains
    value: 조선의 도읍이던 한양
    metric: 정답-유출
  - &id001
    type: javascript
    value: /(습니다|입니다|세요|해요|네요|십니다|시죠|십시오)/.test(output) === false
    metric: 존댓말-없음
  - &id002
    type: javascript
    value: output.includes('!')
    metric: 느낌표-있음
