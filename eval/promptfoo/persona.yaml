# 페르소나 회귀. 프롬프트를 고쳤을 때 말투와 유출 방어가 무너지는지 본다.
#
#   uv run python -m scripts.build_persona_cases
#   npx promptfoo@latest eval -c eval/promptfoo/persona.yaml --repeat 5
#
# **반복이 필수다.** 판정과 달리 진행 멘트는 temperature가 0이 아니다. 같은
# 상황에서 매번 같은 문장이 나오면 진행자가 녹음기처럼 들리기 때문에 일부러
# 흔들어둔 것이다. 그래서 한 번 통과했다고 지켜진다는 뜻이 아니다.
# **5회 중 5회 통과해야 지킨다고 말할 수 있다.**
#
# 판정 평가(judge.yaml)와 반대 상황인 것이 재미있다. 저기서는 흔들림이
# 노이즈였고 여기서는 흔들림이 설계다. 같은 도구로 두 성질을 다르게 다룬다.

description: 페르소나 회귀 (말투 유지, 정답 유출 금지)

prompts:
  # 프롬프트를 베끼지 않는다. 이유는 eval/promptfoo/host_prompt.py 참고
  - id: file://host_prompt.py:host
    label: persona-base.v1

providers:
  - id: openai:chat:gpt-4o-mini-2024-07-18
    label: gpt-4o-mini
    config:
      # 운영(config.host_temperature/host_max_tokens)과 같은 값이어야 한다.
      # 여기만 0으로 두면 실제로 나가는 것과 다른 것을 재게 된다
      temperature: 0.8
      max_tokens: 200

# scripts/build_persona_cases.py가 만든다
tests: file://cases-persona.yaml
