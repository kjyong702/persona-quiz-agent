[project]
name = "persona-quiz-agent"
version = "0.1.0"
description = "페르소나 AI 호스트가 진행하는 상식 퀴즈 서버"
requires-python = ">=3.12,<3.13"

# 의존성은 실제로 쓰는 Phase에서 추가한다.
# openai, chromadb는 판정 파이프라인을 붙이는 Phase 3에서 들어온다.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "chromadb>=1.5.9",
    "openai>=2.50.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
